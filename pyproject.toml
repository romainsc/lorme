[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lorme"
dynamic = ["version"]
description = "LORME — Local Offline Retrieval & MCP Engine. Semantic search over local documents via Model Context Protocol."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Romain Chantereau" },
]
keywords = ["mcp", "rag", "semantic-search", "sqlite", "embeddings", "local"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "mcp>=2.0",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1",
    "langdetect>=1.0",
    "langcodes>=3.0",
    "charset-normalizer>=3.0",
    "puremagic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
eval = [
    "ragas>=0.4",
]
html = [
    "trafilatura>=2.0",
]
pdf = [
    "docling>=2.100",
    "tesserocr>=2.7",
]
office = [
    "markitdown>=0.1",
]
parse = [
    "trafilatura>=2.0",
    "docling>=2.100",
    "markitdown>=0.1",
]
video = [
    "yt-dlp>=2024.0",
]

[project.scripts]
lorme = "lorme.server:main"

[project.urls]
Homepage = "https://github.com/romainsc/lorme"
Repository = "https://github.com/romainsc/lorme"
Issues = "https://github.com/romainsc/lorme/issues"

[tool.hatch.build.targets.sdist]
exclude = [
    "tests/fixtures/orig/",
    "tests/validation/",
    "workspace-validation/",
    "docs/studies/",
    "eval-report-*.json",
    "mcp-debug-wrapper.sh",
    ".claude/",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/lorme/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lorme"]

[tool.hatch.build.targets.wheel.force-include]
"src/lorme/prompts.yaml" = "lorme/prompts.yaml"
"src/lorme/bootstrap.yaml" = "lorme/bootstrap.yaml"
